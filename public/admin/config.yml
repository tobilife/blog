backend:
  name: git-gateway
  branch: master # 메인 브랜치 이름

# 미디어 파일 저장 위치
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# UI 언어 설정 (한국어)
locale: "ko"

# 편집기 설정
editor:
  preview: true # 미리보기 활성화

# 컬렉션 정의
collections:
  - name: "posts" # CMS에서 사용할 이름
    label: "블로그 포스트" # UI에 표시될 이름
    folder: "src/content/posts" # 파일이 저장될 폴더
    create: true # 새 문서 생성 허용
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # 파일명 형식
    fields: # 필드 정의
      - {label: "제목", name: "title", widget: "string", required: true}
      - {
          label: "발행일", 
          name: "published", 
          widget: "datetime", 
          date_format: "YYYY-MM-DD", 
          time_format: false, 
          required: true,
          default: ""
        }
      - {label: "설명", name: "description", widget: "text", required: false}
      - {
          label: "카테고리",
          name: "category",
          widget: "string",
          required: false,
          hint: "자유롭게 카테고리를 입력하세요 (예: 기술, 일상, 리뷰, 튜토리얼, 학습, 취미 등)"
        }
      - {
          label: "태그", 
          name: "tags", 
          widget: "list", 
          default: [], 
          required: false, 
          hint: "태그를 입력하고 쉼표(,)로 구분하거나 입력 후 엔터를 누르세요",
          allow_add: true,
          field: {label: "태그", name: "tag", widget: "string"}
        }
      - {label: "대표 이미지", name: "image", widget: "image", required: false, hint: "포스트의 대표 이미지를 선택하세요"}
      - {label: "임시 저장", name: "draft", widget: "boolean", default: false, hint: "체크하면 사이트에 표시되지 않습니다"}
      - {label: "본문", name: "body", widget: "markdown"}
