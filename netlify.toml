[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  # Cache reset to force rebuild
  CACHE_VERSION = "v2"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Edge Functions 설정
[[edge_functions]]
  path = "/api/langflow-edge/*"
  function = "langflow-proxy-edge"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

[[redirects]]
  from = "/api/langflow/*"
  to = "/.netlify/functions/langflow-proxy"
  status = 200

# Edge Function용 새로운 경로
[[redirects]]
  from = "/api/chat/*"
  to = "/.netlify/edge-functions/langflow-proxy-edge"
  status = 200
