[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  # Cache reset to force rebuild
  CACHE_VERSION = "v2"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
# Edge Functions 설정
# Sitemap handler - MUST run first for sitemap files
[[edge_functions]]
  path = "/sitemap*.xml"
  function = "sitemap-handler"

# Googlebot handler - runs before social preview to avoid conflicts
[[edge_functions]]
  path = "/*"
  function = "googlebot-handler"

# Social media preview handler
[[edge_functions]]
  path = "/*"
  function = "social-preview"


[[edge_functions]]
  path = "/health"
  function = "health-check"

[[edge_functions]]
  path = "/api/chat"
  function = "langflow-proxy-edge"
  
  [[edge_functions]]
    path = "/api/cache/check"
    function = "cache-invalidator"

# Sitemap XML files - XML content type 명시
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# HTML 파일에 대한 Content-Type 설정 추가
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=3600"
# 메인 페이지 및 동적 경로에 대한 설정
[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# 포스트 페이지에 대한 설정
[[headers]]
  for = "/posts/*"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# 아카이브 페이지에 대한 설정
[[headers]]
  for = "/archive/*"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# 이미지 파일에 대한 Content-Type 설정
[[headers]]
  for = "/images/*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.jpeg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Content-Type = "image/webp"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/uploads/*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/uploads/*.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/uploads/*.jpeg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/uploads/*.webp"
  [headers.values]
    Content-Type = "image/webp"
    Cache-Control = "public, max-age=31536000, immutable"

# 이중 슬래시 정규화
[[redirects]]
  from = "/*//*"
  to = "/:splat/"
  status = 301

[[redirects]]
  from = "/api/langflow/*"
  to = "/.netlify/functions/langflow-proxy-astra"
  status = 200
  
  [[redirects]]
  from = "/api/langflow/cache-invalidation"
  to = "/.netlify/functions/cache-invalidation"
  status = 200

# OG 이미지 리다이렉트 - 이전 경로 호환성 유지
[[redirects]]
  from = "/assets/images/banner.png"
  to = "/images/banner.png"
  status = 301

[[redirects]]
  from = "/assets/images/*"
  to = "/images/:splat"
  status = 301
