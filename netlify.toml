[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  # Cache reset to force rebuild
  CACHE_VERSION = "v2"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Edge Functions 설정
# Social media preview handler - MUST run first
[[edge_functions]]
  path = "/*"
  function = "social-preview"

# Googlebot handler runs after social preview handler
[[edge_functions]]
  path = "/*"
  function = "googlebot-handler"

[[edge_functions]]
  path = "/health"
  function = "health-check"

[[edge_functions]]
  path = "/api/chat"
  function = "langflow-proxy-edge"
  
  [[edge_functions]]
    path = "/api/cache/check"
    function = "cache-invalidator"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# 이미지 파일에 대한 Content-Type 설정
[[headers]]
  for = "/images/*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.jpeg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Content-Type = "image/webp"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/uploads/*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/uploads/*.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/uploads/*.jpeg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/uploads/*.webp"
  [headers.values]
    Content-Type = "image/webp"
    Cache-Control = "public, max-age=31536000, immutable"

# 이중 슬래시 정규화
[[redirects]]
  from = "/*//"
  to = "/:splat/"
  status = 301

[[redirects]]
  from = "/*//*"
  to = "/:splat1/:splat2"
  status = 301

[[redirects]]
  from = "/api/langflow/*"
  to = "/.netlify/functions/langflow-proxy-astra"
  status = 200
  
  [[redirects]]
  from = "/api/langflow/cache-invalidation"
  to = "/.netlify/functions/cache-invalidation"
  status = 200

# OG 이미지 리다이렉트 - 이전 경로 호환성 유지
[[redirects]]
  from = "/assets/images/banner.png"
  to = "/images/banner.png"
  status = 301

[[redirects]]
  from = "/assets/images/*"
  to = "/images/:splat"
  status = 301
