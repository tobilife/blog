[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  # Cache reset to force rebuild
  CACHE_VERSION = "v2"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Edge Functions 설정
# Facebook crawler handler should run first
[[edge_functions]]
  path = "/*"
  function = "facebook-crawler-handler"

# Googlebot handler runs after Facebook handler
[[edge_functions]]
  path = "/*"
  function = "googlebot-handler"

[[edge_functions]]
  path = "/health"
  function = "health-check"

[[edge_functions]]
  path = "/api/chat"
  function = "langflow-proxy-edge"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

[[redirects]]
  from = "/api/langflow/*"
  to = "/.netlify/functions/langflow-proxy-astra"
  status = 200

# OG 이미지 리다이렉트 - 이전 경로 호환성 유지
[[redirects]]
  from = "/assets/images/banner.png"
  to = "/images/banner.png"
  status = 301

[[redirects]]
  from = "/assets/images/*"
  to = "/images/:splat"
  status = 301
